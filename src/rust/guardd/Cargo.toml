[package]
name = "guardd"
version = "0.1.0"
edition = "2021"

[lib]
name = "guardd"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "gen_perfect_hash"
path = "src/bin/gen_perfect_hash.rs"

[[bin]]
name = "guardd_sha256"
path = "src/bin/guardd_sha256.rs"

[[bin]]
name = "guardd_perfect_hash"
path = "src/bin/guardd_perfect_hash.rs"

[[bin]]
name = "guardd_bitflip"
path = "src/bin/guardd_bitflip.rs"

[[bin]]
name = "guardd_quant128"
path = "src/bin/guardd_quant128.rs"

[dependencies]
sha2 = "0.11"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
rand = "0.8"
tempfile = "3.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true 