name: Model Asset Guard CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Lean
        uses: leanprover/lean-action@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/guardd/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/guardd/Cargo.lock', 'src/rust/guardd/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov

      - name: Run canonical preflight
        shell: bash
        run: bash scripts/ci_preflight.sh

      - name: Node smoke (skip if koffi/lib unavailable)
        shell: bash
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}"
          GUARDD_LIB=""
          for cand in \
            "$ROOT/bindings/nodejs/native/libguardd.so" \
            "$ROOT/bindings/nodejs/native/libguardd.dylib" \
            "$ROOT/bindings/nodejs/native/guardd.dll" \
            "$ROOT/dist/native/libguardd.so" \
            "$ROOT/dist/native/libguardd.dylib" \
            "$ROOT/dist/native/guardd.dll" \
            "$ROOT/src/rust/guardd/target/debug/libguardd.so" \
            "$ROOT/src/rust/guardd/target/release/libguardd.so" \
            "$ROOT/src/rust/guardd/target/debug/libguardd.dylib" \
            "$ROOT/src/rust/guardd/target/release/libguardd.dylib" \
            "$ROOT/src/rust/guardd/target/debug/guardd.dll" \
            "$ROOT/src/rust/guardd/target/release/guardd.dll"; do
            if [ -f "$cand" ]; then
              GUARDD_LIB="$cand"
              break
            fi
          done
          # Fallback: first matching cdylib under target (ubuntu/mac layout variance).
          if [ -z "$GUARDD_LIB" ]; then
            GUARDD_LIB="$(find "$ROOT/src/rust/guardd/target" \
              \( -name 'libguardd.so' -o -name 'libguardd.dylib' -o -name 'guardd.dll' \) \
              2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$GUARDD_LIB" ]; then
            export GUARDD_LIB
            echo "GUARDD_LIB=$GUARDD_LIB"
          else
            echo "WARN: libguardd not found under target/; Node smoke will skip if unresolved"
            ls -la "$ROOT/src/rust/guardd/target/debug" 2>/dev/null || true
            ls -la "$ROOT/src/rust/guardd/target/release" 2>/dev/null || true
          fi
          npm install --no-fund --no-audit
          set +e
          npm test
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Node smoke passed"
          elif [ "$code" -eq 2 ]; then
            echo "Node smoke skipped (native dep or libguardd unavailable)"
          else
            echo "Node smoke failed with exit $code"
            exit "$code"
          fi

      - name: Stage release guardd native library
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path src/rust/guardd/Cargo.toml --locked
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pwsh -File scripts/stage_guardd_native.ps1 -Profile release
          else
            bash scripts/stage_guardd_native.sh
          fi

      - name: Upload guardd native artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardd-native-${{ matrix.os }}
          path: dist/native/
          if-no-files-found: error

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.os }}
          path: |
            benchmark_results.txt
            coverage.xml
            test_results.json
          if-no-files-found: ignore

  security:
    name: Dependency and unsafe checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --manifest-path src/rust/guardd/Cargo.toml

      - name: Count unsafe usage
        run: |
          UNSAFE_COUNT=$(rg "unsafe" src/rust/guardd/src --count | awk -F: '{sum += $2} END {print sum+0}')
          echo "Unsafe keyword occurrences: $UNSAFE_COUNT"
          test "$UNSAFE_COUNT" -le 20

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Lean
        uses: leanprover/lean-action@v1

      - name: Run benchmark executable
        run: |
          lake exe benchmarks | tee benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.txt
